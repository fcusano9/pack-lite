<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The single source of truth for the Pack Lite app icon. Every PNG under
       assets/icon/ is derived from this file by build_icons.py, which swaps the
       backdrop and/or drops the art group to produce the renders it needs.
       Keep the ids "backdrop" and "art" — the build script looks them up. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A72F0"/>
      <stop offset="1" stop-color="#1B44AC"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6F7"/>
      <stop offset="1" stop-color="#8EA5CD"/>
    </linearGradient>
    <!-- The check is cut OUT of the shell rather than drawn on top, so the green
         panel behind shows through and green never touches cobalt. -->
    <mask id="cut">
      <rect x="267" y="300" width="490" height="452" rx="80" fill="#fff"/>
      <path d="M405 527 L475 597 L619 443" stroke="#000" stroke-width="58" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect id="backdrop" width="1024" height="1024" fill="url(#bg)"/>

  <!-- class="depth" marks purely decorative shading and class="panel" the green
       fill behind the cut. build_icons.py strips both when deriving the flat
       monochrome silhouette Android tints for themed icons — without dropping
       the panel the knockout would fill in and the check would vanish. -->
  <g id="art">
    <!-- telescopic handle -->
    <rect x="438" y="176" width="147" height="42" rx="21" fill="url(#metal)"/>
    <rect x="455" y="196" width="33" height="128" fill="url(#metal)"/>
    <rect x="536" y="196" width="33" height="128" fill="url(#metal)"/>
    <!-- wheels, each above its own contact shadow -->
    <circle class="depth" cx="358" cy="814" r="52" fill="#0E2B6E" opacity="0.3"/>
    <circle class="depth" cx="666" cy="814" r="52" fill="#0E2B6E" opacity="0.3"/>
    <circle cx="358" cy="798" r="52" fill="url(#metal)"/>
    <circle cx="666" cy="798" r="52" fill="url(#metal)"/>
    <!-- shell: drop shadow, green panel, then the shell with the check knocked out -->
    <rect class="depth" x="267" y="318" width="490" height="452" rx="80" fill="#0E2B6E" opacity="0.32"/>
    <rect class="panel" x="267" y="300" width="490" height="452" rx="80" fill="#199A6D"/>
    <rect x="267" y="300" width="490" height="452" rx="80" fill="url(#shell)" mask="url(#cut)"/>
  </g>
</svg>
