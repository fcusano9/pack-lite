name: Build APK

# Builds a release-signed arm64 APK on every pull request and on every push to
# main (i.e. when a PR is merged). Download it from the run's "Artifacts".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch/PR cancels an in-progress run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Recreate the git-ignored signing files from encrypted repo secrets so
      # the release build is signed with the real keystore (installs over the
      # app on the phone). Values never appear in logs — Actions masks them.
      - name: Restore keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set. Add KEYSTORE_BASE64, KEY_STORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS (see .github/workflows/build-apk.yml header / the PR that added it)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/packlite-release.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=packlite-release.jks"
          } > android/key.properties

      # Use --split-per-abi so the arm64 APK's versionCode carries Flutter's ABI
      # offset (arm64 => +2000, e.g. 2005 for pubspec 1.0.0+5). Local dev builds
      # use --split-per-abi too, so the codes match and a CI APK installs right
      # over a locally-installed build instead of being blocked as a downgrade.
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-lite-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
