name: Build APK

# Builds a release-signed arm64 APK (sideloading) and an Android App Bundle
# (the only format Google Play accepts) on every pull request and on every push
# to main. Download either from the run's "Artifacts".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch/PR cancels an in-progress run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Recreate the git-ignored signing files from encrypted repo secrets so
      # the release build is signed with the real keystore (installs over the
      # app on the phone). Values never appear in logs — Actions masks them.
      - name: Restore keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set. Add KEYSTORE_BASE64, KEY_STORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS (see .github/workflows/build-apk.yml header / the PR that added it)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/packlite-release.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=packlite-release.jks"
          } > android/key.properties

      # Both stores reject a build number they have already seen, so it cannot
      # come from pubspec's `+N` — that would make every CI build identical and
      # force a manual bump before each upload (REL-5). `run_number` increments
      # per run of *this* workflow and never repeats.
      #
      # Two things to know about it: it is independent of the iOS workflow's
      # counter (fine — the stores track separately), and GitHub resets it if
      # this file is renamed, which would start handing out numbers the stores
      # have already accepted. Renaming this workflow means setting a floor
      # here, e.g. `$(( ${{ github.run_number }} + 1000 ))`.
      - name: Resolve build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      # --split-per-abi so the arm64 APK's versionCode carries Flutter's ABI
      # offset (arm64 => +2000, so build number 76 => 2076). Local dev builds
      # use --split-per-abi too, so the codes match and a CI APK installs right
      # over a locally-installed build instead of being blocked as a downgrade.
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --build-number=$BUILD_NUMBER

      # Play will not take an APK. The bundle has a single versionCode with no
      # ABI offset, so it is the build number as-is — unrelated to the APK's,
      # and compared only against previous Play uploads.
      - name: Build release App Bundle
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-lite-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-lite-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Guards the whole point of REL-5: if --build-number ever stops applying,
      # every artifact silently falls back to pubspec's `+N` and store uploads
      # start colliding again — which you would only discover at upload time.
      # Checking the APK covers the bundle too, since it is the same flag on the
      # same build; the APK is the one `aapt2` can read directly.
      - name: Verify the build number reached the artifacts
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          EXPECTED=$((BUILD_NUMBER + 2000))  # arm64's ABI offset from --split-per-abi
          ACTUAL=$("$AAPT2" dump badging \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "arm64 APK versionCode=$ACTUAL (expected $EXPECTED)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::--build-number did not apply. Store uploads would reuse a build number and be rejected."
            exit 1
          fi
