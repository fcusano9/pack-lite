name: Build iOS

# The dev Mac can build iOS locally since 2026-07-27 (Xcode 26.6, see CLAUDE.md),
# so this is no longer the only thing that compiles the iOS target — it is the
# thing that compiles it *without anyone remembering to*. GitHub's macOS runners
# ship Xcode and are free for public repositories.
#
# It does two things:
#   1. a release compile for a real device, unsigned — proves the iOS target and
#      every plugin's iOS implementation actually build;
#   2. a simulator build that is then launched and screenshotted — proves the app
#      starts, which compiling alone does not.
#
# `flutter analyze` and `flutter test` are deliberately NOT repeated here; the
# Build APK workflow already gates those on the same commit, and macOS runner
# minutes are slower.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS (unsigned) + simulator smoke test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install dependencies
        run: flutter pub get

      # Same reasoning as the APK workflow: App Store Connect rejects a
      # CFBundleVersion it has seen before, so it must not come from pubspec's
      # `+N`. Nothing here is uploadable yet (see below), so this is currently
      # only about having the mechanism right for when IOS-REL-8 adds
      # `flutter build ipa`. Counts independently of the APK workflow, which is
      # fine — the two stores compare against their own histories.
      - name: Resolve build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Unsigned because the signing identity lives on Frank's machine and Apple
      # account, not here. The output can't be installed on a device; it exists
      # to prove the build is not broken.
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Build for simulator
        run: flutter build ios --simulator --debug --build-number=$BUILD_NUMBER

      # Strict: a launch failure fails the build.
      - name: Launch in a simulator and screenshot it
        id: smoke
        run: |
          set -euxo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          candidates = [d for runtime in devices for d in devices[runtime]
                        if 'iPhone' in d['name']]
          if not candidates:
              sys.exit('No iPhone simulator available on this runner')
          print(candidates[-1]['udid'])
          ")
          echo "Using simulator $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          # A failed launch exits non-zero here, so this is itself a real check.
          xcrun simctl launch "$UDID" com.packlite.app
          sleep 12
          xcrun simctl io "$UDID" screenshot pack-lite-ios.png
          # A launch that crashed immediately would still screenshot fine (an
          # empty springboard), so confirm the process is actually still alive
          # rather than trusting that the PNG exists.
          #
          # Capture first, then grep. Piping `launchctl list` straight into
          # `grep -q` makes grep exit on the first match and close the pipe,
          # which hands the still-writing producer a SIGPIPE; under `pipefail`
          # that surfaces as exit 141 and fails the step *because the assertion
          # passed*. Assigning to a variable removes the pipe entirely.
          RUNNING_PROCESSES=$(xcrun simctl spawn "$UDID" launchctl list)
          if ! grep -q com.packlite.app <<<"$RUNNING_PROCESSES"; then
            echo "::error::Pack Lite is not running after launch — it started and then exited."
            exit 1
          fi
          echo "Confirmed com.packlite.app is still running after launch."

      - name: Upload iOS build and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pack-lite-ios
          path: |
            build/ios/iphoneos/Runner.app
            pack-lite-ios.png
          if-no-files-found: warn
